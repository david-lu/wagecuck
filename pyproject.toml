[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wagecuck"
version = "0.1.0"
description = "Deterministic Playwright job application workflows with bounded agent assistance"
requires-python = ">=3.11"
dependencies = ["playwright>=1.51,<2", "pydantic>=2.10,<3", "httpx>=0.28,<1", "reportlab>=4,<6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
wagecuck = "wagecuck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wagecuck = ["*.js", "*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

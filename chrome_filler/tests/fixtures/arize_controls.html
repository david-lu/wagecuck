<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Arize style application controls</title></head>
<body>
  <form id="application-job-frm">
    <div class="field-item">
      <label for="first_name">First Name*</label>
      <input type="text" name="first_name" id="first_name" required>
    </div>
    <div>
      <p>Will you now or in the future require sponsorship for employment?*</p>
      <input type="hidden" name="questions[sponsorship]" value="sponsorship">
      <div class="field-item">
        <label><input type="radio" name="sponsorship" value="1" required>Yes</label>
        <label><input type="radio" name="sponsorship" value="0" required>No</label>
      </div>
    </div>
    <div class="select-field">
      <p>Veteran Status</p>
      <label><input type="radio" name="veteran_status" value="1">I am not a protected veteran</label>
      <label><input type="radio" name="veteran_status" value="3">I don't wish to answer</label>
    </div>
    <div class="select-field" id="race_dropdown_container" style="display:none">
      <p>Please identify your race</p>
      <label><input type="radio" name="race" value="1">Asian</label>
      <label><input type="radio" name="race" value="2">Decline To Self Identify</label>
    </div>
  </form>
  <footer><button type="button" role="switch" aria-checked="false" aria-label="Switch to dark mode">Theme</button></footer>
</body>
</html>

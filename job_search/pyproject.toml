[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wagecuck-search"
version = "0.1.0"
description = "Independent multi-site job discovery, filtering, and deduplication"
requires-python = ">=3.11"
dependencies = ["playwright>=1.51,<2", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
wagecuck-search = "wagecuck_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
